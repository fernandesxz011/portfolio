name: Publicar portfólio no GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        id: pages
      - name: Definir URLs públicas
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/configure-site.mjs
      - name: Verificar arquivos
        run: npm run check
      - name: Preparar somente arquivos públicos
        run: |
          mkdir -p dist
          cp index.html 404.html robots.txt sitemap.xml .nojekyll dist/
          cp -r assets dist/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
